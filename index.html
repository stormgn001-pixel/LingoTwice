<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingoTwice — Билингвальный браузер параллельного чтения</title>
    <meta name="description" content="Многоязычный браузер параллельного чтения и изучения иностранных языков с синхронной прокруткой, контекстным словарём и интервальным повторением." />
    <meta property="og:title" content="LingoTwice — Билингвальный браузер параллельного чтения" />
    <meta property="og:description" content="Многоязычный браузер параллельного чтения и изучения иностранных языков с синхронной прокруткой, контекстным словарём и интервальным повторением." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var prefs = JSON.parse(localStorage.getItem('linguatwin_preferences_v1'));
          var theme = (prefs && prefs.theme) || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (theme === 'sepia') {
            document.documentElement.classList.add('theme-sepia');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-100 selection:text-amber-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
